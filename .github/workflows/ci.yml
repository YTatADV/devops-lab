name: PR CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: [self-hosted, Windows, X64, lab]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    needs: lint
    runs-on: [self-hosted, Windows, X64, lab]
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-node${{ matrix.node }}
          path: reports/
          retention-days: 7

      - name: 失敗摘要
        if: failure()
        env:
          NODE: ${{ matrix.node }}
        run: |
          {
            echo "### 測試失敗（Node $NODE）"
            echo "請下載 Artifact「test-report-node$NODE」查看詳細報告。"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: test
    runs-on: [self-hosted, Windows, X64, lab]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

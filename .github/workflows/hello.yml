name: Hello
on:
  pull_request:
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          BRANCH: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: echo "Triggered by $EVENT_NAME, branch $BRANCH"